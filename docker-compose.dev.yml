services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: blogapp-server-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
    networks:
      - blogapp-dev-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: blogapp-client-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env.local
    depends_on:
      - server
    networks:
      - blogapp-dev-net

networks:
  blogapp-dev-net:
    driver: bridge
